<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Склад — ЖД запчасти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f7; --bg-grad1:rgba(91,58,41,.10); --bg-grad2:rgba(91,58,41,.06);
  --card:rgba(255,255,255,.72); --card-solid:#fff; --chat-bg:rgba(255,255,255,.55);
  --text:#111827; --muted:#6b7280; --border:rgba(17,24,39,.08);
  --accent:#5B3A29; --accent-dark:#3e2723; --accent-soft:rgba(91,58,41,.10);
  --user-bub:linear-gradient(135deg,#5B3A29,#3e2723); --user-text:#fff;
  --green:#10b981; --red:#ef4444; --shadow:0 8px 28px rgba(17,24,39,.10);
  --shadow-sm:0 2px 10px rgba(17,24,39,.06); --r-lg:22px; --r-md:14px; --r-sm:10px;
}
html[data-theme="dark"]{
  --bg:#17171a; --bg-grad1:rgba(255,255,255,.05); --bg-grad2:rgba(91,58,41,.12);
  --card:rgba(40,40,45,.72); --card-solid:#26262b; --chat-bg:rgba(40,40,45,.55);
  --text:#f3f4f6; --muted:#9ca3af; --border:rgba(255,255,255,.10);
  --accent-soft:rgba(245,222,179,.12);
  --user-bub:linear-gradient(135deg,#8a6a52,#6b4a35); --user-text:#fff;
  --shadow:0 8px 28px rgba(0,0,0,.45); --shadow-sm:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text); margin:0; padding:18px 14px;
  display:flex; justify-content:center; min-height:100vh;
  background-image:radial-gradient(60% 40% at 15% 10%,var(--bg-grad1),transparent),
                   radial-gradient(50% 35% at 85% 90%,var(--bg-grad2),transparent);
  background-attachment:fixed;
}
.bento{width:100%;max-width:540px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
@media(max-width:480px){.bento{grid-template-columns:1fr}}

/* ---------- бенто-карточки ---------- */
.b-card{
  background:var(--card); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--border); border-radius:var(--r-lg); padding:18px;
  box-shadow:var(--shadow); transition:transform .25s cubic-bezier(.25,1,.5,1), box-shadow .25s;
  animation:cardIn .5s cubic-bezier(.25,1,.5,1) backwards;
}
.b-card:nth-child(1){animation-delay:.02s}.b-card:nth-child(2){animation-delay:.08s}
.b-card:nth-child(3){animation-delay:.14s}.b-card:nth-child(4){animation-delay:.2s}
.b-card:active{transform:scale(.985)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- шапка ---------- */
.b-card.header{
  grid-column:span 2; color:#fff; border:none; overflow:hidden; position:relative;
  background:linear-gradient(135deg,#6b4a35,#3e2723);
  box-shadow:0 10px 30px rgba(62,39,35,.35);
}
.b-card.header::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(80% 60% at 80% 0%,rgba(255,255,255,.18),transparent 60%);
  pointer-events:none;
}
.logo{
  width:54px;height:54px;flex-shrink:0;border-radius:18px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
}
.header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.header .sub{color:rgba(255,255,255,.8);font-size:13px;margin-top:3px}
.theme-btn{
  margin-left:auto;width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.15);color:#fff;font-size:19px;cursor:pointer;
  transition:.25s;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.theme-btn:hover{background:rgba(255,255,255,.3);transform:rotate(15deg)}

/* ---------- профиль ---------- */
.b-card.profile{display:flex;flex-direction:column;gap:12px;min-height:118px}
.avatar{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#ede9fe,#f5e0d0);
  color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:inset 0 0 0 2px rgba(91,58,41,.12);
}
.emp-name{font-weight:700;font-size:15px;margin:0;letter-spacing:-.2px}
.emp-role{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-top:2px}
.badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;width:fit-content;transition:.3s}
.badge.guest{background:rgba(239,68,68,.12);color:#b91c1c}
.badge.staff{background:rgba(16,185,129,.14);color:#047857}
html[data-theme="dark"] .badge.guest{background:rgba(239,68,68,.2);color:#f87171}
html[data-theme="dark"] .badge.staff{background:rgba(16,185,129,.2);color:#34d399}
#loginBox{display:flex;gap:8px}
#loginBox input{
  flex:1;min-width:0;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);
  font:inherit;font-size:14px;outline:none;background:var(--card-solid);color:var(--text);transition:.2s;
}
#loginBox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-primary{
  background:var(--user-bub);color:#fff;border:none;cursor:pointer;border-radius:var(--r-md);
  font:inherit;font-weight:600;font-size:14px;padding:11px 16px;transition:.2s;white-space:nowrap;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(62,39,35,.35)}
.btn-primary:active{transform:scale(.96)}

/* ---------- чат ---------- */
.b-card.chat{grid-column:span 2;display:flex;flex-direction:column;height:56vh;min-height:360px;padding:12px;gap:0}
#chat{
  flex:1;overflow-y:auto;background:var(--chat-bg);border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;scroll-behavior:smooth;
}
#chat::-webkit-scrollbar{width:5px}
#chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.msg{
  padding:11px 15px;border-radius:18px;max-width:86%;font-size:14px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  animation:pop .3s cubic-bezier(.25,1,.5,1);
  box-shadow:var(--shadow-sm);
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
.msg.bot{background:var(--card-solid);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:6px}
.msg.user{background:var(--user-bub);color:var(--user-text);align-self:flex-end;border-bottom-right-radius:6px}
.msg .who{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:3px}
html[data-theme="dark"] .msg .who{color:#d4b896}
.msg .time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.msg.typing{color:var(--muted);font-style:italic;background:var(--card-solid);border:1px dashed var(--border);display:flex;gap:4px;align-items:center;padding:14px 18px}
.msg.typing .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dotJump 1.2s infinite}
.msg.typing .dot:nth-child(2){animation-delay:.15s}
.msg.typing .dot:nth-child(3){animation-delay:.3s}
@keyframes dotJump{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* ---------- ввод ---------- */
.b-card.input{grid-column:span 2}
.auto-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#d1d5db;border-radius:24px;transition:.3s}
html[data-theme="dark"] .slider{background:#3f3f46}
.slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider::before{transform:translateX(20px)}
#inputRow{display:flex;gap:8px}
#text{
  flex:1;min-width:0;padding:13px 15px;border:1px solid var(--border);border-radius:16px;
  font:inherit;font-size:15px;outline:none;background:var(--card-solid);color:var(--text);transition:.2s;
}
#text:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-mic{
  width:48px;height:48px;border-radius:16px;border:1px solid var(--border);background:var(--card-solid);
  cursor:pointer;font-size:20px;transition:.2s;flex-shrink:0;color:var(--text);
}
.btn-mic:hover{border-color:var(--accent);transform:scale(1.05)}
.btn-mic.listening{background:#10b981;border-color:#10b981;color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
.btn-send{
  width:48px;height:48px;border-radius:16px;border:none;background:var(--user-bub);color:#fff;
  font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0;transition:.2s;
}
.btn-send:hover{transform:scale(1.05)}
.btn-send:active{transform:scale(.92)}
#mic-status{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px;display:flex;align-items:center;gap:6px}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.eq.on{display:flex}
.eq span{width:3px;background:var(--accent);border-radius:2px;animation:eqJump .9s infinite ease-in-out}
.eq span:nth-child(1){height:6px}.eq span:nth-child(2){height:12px;animation-delay:.15s}
.eq span:nth-child(3){height:9px;animation-delay:.3s}.eq span:nth-child(4){height:13px;animation-delay:.45s}
@keyframes eqJump{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* ---------- тосты ---------- */
#toast-container{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{
  background:var(--card-solid);color:var(--text);padding:13px 18px;border-radius:16px;
  box-shadow:0 12px 34px rgba(0,0,0,.22);border:1px solid var(--border);
  opacity:0;visibility:hidden;transform:translateY(20px) scale(.95);
  transition:.35s cubic-bezier(.25,1,.5,1);font-weight:500;font-size:13px;
  display:flex;align-items:center;gap:10px;
}
.toast.show{opacity:1;visibility:visible;transform:none}
.toast.error{border-color:rgba(239,68,68,.4)}
</style>
</head>
<body>
<div class="bento">
  <div class="b-card header">
    <div class="logo">📦</div>
    <div>
      <h1>Склад</h1>
      <div class="sub">ЖД запчасти — голосом и текстом</div>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Тема">🌙</button>
  </div>

  <div class="b-card profile">
    <div id="profileHeader" style="display:none;align-items:center;gap:12px;">
      <div class="avatar">👤</div>
      <div>
        <h3 class="emp-name" id="emp-name">Гость</h3>
        <div class="emp-role" id="emp-role">только остатки</div>
      </div>
    </div>
    <div id="loginBox">
      <input id="email" placeholder="Почта (пусто — гость)" onkeydown="if(event.key=='Enter')doLogin()">
      <button class="btn-primary" onclick="doLogin()">Войти</button>
    </div>
    <div id="accessBadgeWrap" style="display:none;">
      <span class="badge guest" id="access-badge">Только остатки</span>
    </div>
  </div>

  <div class="b-card chat"><div id="chat"></div></div>

  <div class="b-card input">
    <div class="auto-row">
      <label class="switch">
        <input type="checkbox" id="autoListen" onchange="toggleAutoMode()" checked>
        <span class="slider"></span>
      </label>
      <span><b>Авто-режим</b> — слушаю постоянно</span>
    </div>
    <div id="inputRow">
      <input id="text" placeholder="«Склад, сколько РТИ-132?»" onkeydown="if(event.key=='Enter')sendText()">
      <button class="btn-mic" id="mic" onclick="onMic()" title="Слушать">🎤</button>
      <button class="btn-send" onclick="sendText()">→</button>
    </div>
    <div id="mic-status"><div class="eq" id="eq"><span></span><span></span><span></span><span></span></div><span id="status-text"></span></div>
  </div>
</div>

<div id="toast-container"><div id="toast" class="toast"></div></div>

<script>
// Запасной адрес на случай, если страница открыта не из веб-приложения.
// Основной путь — google.script.run: он не зависит от перевыкладывания скрипта.
const API_URL = 'https://script.google.com/macros/s/AKfycbwJ55KuieNOpyC7_0vp3j1fjA3yjs3ZXYARFYZ-7t5TmA2csqXghR4bMZ9oyZyy5aai/exec';

let user = { email: '', name: 'Гость', canWrite: false };
let voiceState = {};
let rec = null;
let listening = false;
let autoMode = true;
let botSpeaking = false;
let micGranted = false;
let restartTimer = null;
let toastTimer = null;
let statusTimer = null;

// ---------- ТЕМА ----------
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('sklad-theme', t); } catch (e) {}
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
(function initTheme() {
  let t = 'light';
  try { t = localStorage.getItem('sklad-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
  applyTheme(t);
})();

// ---------- ТОСТЫ ----------
function showToast(message, type) {
  const toast = document.getElementById('toast');
  toast.className = 'toast show' + (type === 'error' ? ' error' : '');
  toast.textContent = '';
  const icon = document.createElement('span');
  icon.textContent = type === 'error' ? '❌' : '✅';
  const body = document.createElement('span');
  body.textContent = message;
  toast.append(icon, body);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}

// ---------- ЧИСЛА СЛОВАМИ ----------
const NUM_WORDS = {
  'ноль':'0','один':'1','одна':'1','одно':'1','два':'2','две':'2','три':'3','четыре':'4','пять':'5',
  'шесть':'6','семь':'7','восемь':'8','девять':'9','десять':'10','одиннадцать':'11','двенадцать':'12',
  'тринадцать':'13','четырнадцать':'14','пятнадцать':'15','шестнадцать':'16','семнадцать':'17',
  'восемнадцать':'18','девятнадцать':'19','двадцать':'20','тридцать':'30','сорок':'40','пятьдесят':'50',
  'шестьдесят':'60','семьдесят':'70','восемьдесят':'80','девяносто':'90','сто':'100','двести':'200',
  'триста':'300','четыреста':'400','пятьсот':'500','шестьсот':'600','семьсот':'700','восемьсот':'800','девятьсот':'900'
};

function wordsToDigits(s) {
  const toks = String(s).split(/\s+/), out = [];
  let total = 0, cur = 0, inRun = false;
  const flush = () => {
    if (inRun) { out.push(String(total + cur)); total = 0; cur = 0; inRun = false; }
  };
  for (let i = 0; i < toks.length; i++) {
    const w = toks[i].replace(/[.,;:!?]+$/g, '');
    if (NUM_WORDS[w] !== undefined) {
      const v = parseInt(NUM_WORDS[w], 10);
      if (v >= 20) { if (inRun) total += cur; cur = v; inRun = true; }
      else { cur += v; inRun = true; }
    } else { flush(); out.push(toks[i]); }
  }
  flush();
  return out.join(' ');
}

// ---------- СИНОНИМЫ ----------
const SYNONYMS = [
  { re: /(добав(?:ить|ь|ите)\s+(?:нов[а-яё]*\s+)?товар|созда(?:ть|й)\s+товар|заведи\s+товар)/i, to: 'добавь товар' },
  { re: /(сним[а-яё]*\s+резерв[а-яё]*|убер[а-яё]*\s+резерв[а-яё]*|отмен[а-яё]*\s+резерв[а-яё]*)/i, to: 'сними резерв' },
  { re: /(зарезервир[а-яё]*|забронир[а-яё]*|бронь)/i, to: 'резерв' },
  { re: /отгруз[а-яё]*/i, to: 'отгрузка' },
  { re: /(прибав[а-яё]*|приход[а-яё]*|привез[а-яё]*|принесли|поступлени[а-яё]*|плюс)/i, to: 'пришло' },
  { re: /(расход[а-яё]*|продали|увез[а-яё]*|ушло|минус|убав[а-яё]*)/i, to: 'списал' },
  { re: /(остатк[а-яё]*|сколько\s+остал[а-яё]*)/i, to: 'сколько' }
];

function normalize(q) {
  let s = String(q).toLowerCase().replace(/ё/g, 'е');
  s = wordsToDigits(s);
  s = (' ' + s + ' ')
    .replace(/\s+(?:точка|точки|точку)\s+/g, '.')
    .replace(/\s+(?:тире|дефис|черточка)\s+/g, '-')
    .replace(/\s+запята[яию]\s+/g, ',')
    .replace(/\s+слэш\s+/g, '/')
    .replace(/\s{2,}/g, ' ')
    .trim();
  s = s.replace(/(^|[^а-яa-z\d_])([а-яa-z]{1,4})\s+(\d{2,6})(?![\dа-яa-z])/g, '$1$2$3');
  for (const { re, to } of SYNONYMS) { if (re.test(s)) { s = s.replace(re, ' ' + to + ' '); break; } }
  return s.replace(/\s{2,}/g, ' ').trim();
}

// ---------- СЕРВЕР ----------
async function api(params) {
  if (window.google && google.script && google.script.run) {
    if (params.action === 'login') {
      return new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiLogin(params.email || ''));
    }
    if (params.action === 'voice') {
      let st = params.state;
      if (typeof st === 'string') { try { st = JSON.parse(st || '{}'); } catch (e) { st = {}; } }
      return new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
          .apiVoice({ query: params.query || '', state: st || {}, email: params.email || '' }));
    }
    throw new Error('Неизвестное действие: ' + params.action);
  }
  const url = new URL(API_URL);
  for (const k in params) {
    const v = params[k];
    url.searchParams.set(k, typeof v === 'object' ? JSON.stringify(v) : v);
  }
  const res = await fetch(url.toString(), { method: 'GET' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ---------- ЧАТ ----------
function addMsg(text, who) {
  const box = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who === 'bot') {
    const w = document.createElement('div');
    w.className = 'who';
    w.textContent = '📦 Склад';
    d.appendChild(w);
  }
  d.appendChild(document.createTextNode(text));
  const tm = document.createElement('div');
  tm.className = 'time';
  const now = new Date();
  tm.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  d.appendChild(tm);
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function addTyping() {
  const box = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg bot typing';
  d.textContent = '';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('span');
    dot.className = 'dot';
    d.appendChild(dot);
  }
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}
function sendText() {
  const el = document.getElementById('text');
  const t = el.value.trim();
  if (!t) return;
  el.value = '';
  send(t);
}
async function send(query) {
  addMsg(query, 'user');
  const norm = normalize(query);
  const t = addTyping();
  try {
    const out = await api({ action: 'voice', query: norm, state: voiceState, email: user.email });
    voiceState = out.state || {};
    t.remove();
    addMsg(out.reply, 'bot');
    speak(out.reply);
  } catch (err) {
    t.remove();
    addMsg('Ошибка связи: ' + (err && err.message ? err.message : err), 'bot');
  }
}
async function doLogin() {
  const email = document.getElementById('email').value;
  const t = addTyping();
  try {
    const acc = await api({ action: 'login', email: email });
    t.remove();
    if (acc && acc.ok === false) {
      showToast(acc.message || 'Не получилось войти', 'error');
      return;
    }
    user = acc;
    document.getElementById('emp-name').textContent = acc.name || 'Гость';
    document.getElementById('emp-role').textContent = acc.canWrite ? (acc.role || 'полный доступ') : 'только остатки';
    const badge = document.getElementById('access-badge');
    badge.textContent = acc.canWrite ? '✓ Полный доступ' : 'Только остатки';
    badge.className = 'badge ' + (acc.canWrite ? 'staff' : 'guest');
    document.getElementById('accessBadgeWrap').style.display = 'block';
    document.getElementById('profileHeader').style.display = 'flex';
    document.getElementById('loginBox').style.display = 'none';
    addMsg(acc.message, 'bot');
    speak(acc.message);
    showToast(acc.canWrite ? 'Полный доступ' : 'Только остатки');
  } catch (err) {
    t.remove();
    showToast('Ошибка входа: ' + (err && err.message ? err.message : err), 'error');
  }
}

// ---------- МИКРОФОН ----------
function setStatus(text) {
  const s = document.getElementById('status-text');
  s.textContent = text || '';
  clearTimeout(statusTimer);
  if (text) statusTimer = setTimeout(() => { s.textContent = ''; }, 6000);
}
function setEq(on) { document.getElementById('eq').classList.toggle('on', !!on); }

async function onMic() {
  if (listening) { try { rec.stop(); } catch (e) {} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('Нужен Chrome или Яндекс.Браузер', 'error'); return; }
  if (micGranted) { startRecognition(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(tr => tr.stop());
    micGranted = true;
    startRecognition();
  } catch (e) {
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      showToast('Микрофон запрещён: значок 🎤 слева от адреса → «Разрешить»', 'error');
    } else if (e.name === 'NotFoundError') {
      showToast('Микрофон не найден. Проверьте подключение', 'error');
    } else {
      showToast('Микрофон недоступен: ' + e.name, 'error');
    }
    if (autoMode) { autoMode = false; document.getElementById('autoListen').checked = false; }
  }
}

function scheduleRestart() {
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    if (autoMode && !listening && !botSpeaking) startRecognition();
  }, 700);
}

function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new SR();
  rec.lang = 'ru-RU';
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  listening = true;
  setMic(true);
  setEq(true);
  setStatus('Слушаю… говорите.');

  rec.onresult = function (e) {
    let interim = '', final = '';
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) final += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (interim) setStatus('Слышу: «' + interim.trim() + '»');
    if (final.trim()) {
      setStatus('');
      setEq(false);
      listening = false; setMic(false);
      send(final.trim());
    }
  };

  rec.onerror = function (e) {
    listening = false; setMic(false); setEq(false);
    const map = {
      'not-allowed': 'Доступ к микрофону запрещён браузером',
      'network': 'Нет связи с сервером распознавания — проверьте интернет',
      'audio-capture': 'Микрофон не найден'
    };
    if (e.error !== 'aborted' && e.error !== 'no-speech') {
      showToast(map[e.error] || ('Ошибка: ' + e.error), 'error');
    }
  };

  rec.onend = function () {
    listening = false; setMic(false); setEq(false);
    if (botSpeaking) return;
    if (autoMode) { setStatus('Слушаю дальше… (авто-режим)'); scheduleRestart(); }
    else setStatus('Ожидание. Нажмите 🎤, чтобы сказать ещё.');
  };

  try { rec.start(); }
  catch (e) { listening = false; setMic(false); setEq(false); }
}

function setMic(on) {
  const b = document.getElementById('mic');
  b.classList.toggle('listening', on);
  b.textContent = on ? '🔴' : '🎤';
}

function toggleAutoMode() {
  autoMode = document.getElementById('autoListen').checked;
  if (autoMode) { onMic(); showToast('Авто-режим включён 🎙️'); }
  else {
    clearTimeout(restartTimer);
    if (listening) { try { rec.stop(); } catch (e) {} }
    setStatus('Авто-режим выключен');
  }
}

// ---------- ГОЛОС (мужской) ----------
let voiceM = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  const ru = vs.filter(v => /ru/i.test(v.lang));
  if (!ru.length) return;
  voiceM =
    ru.find(v => /pavel|dmitri|dmitry|boris|arnold|male/i.test(v.name)) ||
    ru.find(v => /мужск/i.test(v.name)) ||
    ru.find(v => /maxim|максим/i.test(v.name)) ||
    ru.find(v => /google/i.test(v.name)) ||
    ru[0];
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  try {
    if (listening) { botSpeaking = true; try { rec.stop(); } catch (e) {} }
    speechSynthesis.cancel();
    let clean = String(text).replace(/\n/g, '. ');
    if (clean.length > 200) {
      const cut = clean.lastIndexOf(' ', 200);
      clean = clean.slice(0, cut > 0 ? cut : 200) + '…';
    }
    if (!clean) clean = String(text).slice(0, 200);
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'ru-RU';
    if (voiceM) u.voice = voiceM;
    u.rate = 1.02 + Math.random() * 0.12;
    u.pitch = 0.8;
    u.volume = 1;
    const done = () => { botSpeaking = false; if (autoMode && !listening) scheduleRestart(); };
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  } catch (e) { botSpeaking = false; }
}

  'Склад на связи. Начинайте со слова «склад»: например, «склад, остатки».',

];

  addMsg(greet + WELCOME[Math.floor(Math.random() * WELCOME.length)], 'bot');
});
