<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Склад — ЖД запчасти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f4;
  --ink:#1c1f26; --muted:#8a93a5; --border:#e6e9f0;
  --card:#ffffff; --panel:#f7f8fb;
  --accent:#ff5c1a; --accent-dark:#e04a0a; --accent-soft:rgba(255,92,26,.10);
  --grafit:#23262e;
  --green:#22c55e; --red:#ef4444;
  --shadow:0 10px 30px rgba(28,31,38,.08);
  --shadow-in:inset 0 1px 0 rgba(255,255,255,.9);
  --r:24px; --r-sm:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Manrope',sans-serif; background:var(--bg); color:var(--ink);
  margin:0; padding:16px 14px 120px; min-height:100vh;
  display:flex; justify-content:center;
}
.bento{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-content:start}
@media(max-width:480px){.bento{grid-template-columns:repeat(2,1fr)}}

/* ---------- плитки ---------- */
.tile{
  background:var(--card); border-radius:var(--r); padding:18px;
  box-shadow:var(--shadow), var(--shadow-in); border:1px solid var(--border);
  animation:rise .45s cubic-bezier(.2,.9,.3,1.2) backwards;
}
.tile:nth-child(1){animation-delay:0s}.tile:nth-child(2){animation-delay:.06s}
.tile:nth-child(3){animation-delay:.12s}.tile:nth-child(4){animation-delay:.18s}
.tile:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media(max-width:480px){.c6{grid-column:span 2}.c4,.c3{grid-column:span 2}}

/* ---------- шапка-плита ---------- */
.tile.hero{
  background:var(--grafit); border:none; color:#fff; position:relative; overflow:hidden;
  display:flex; align-items:center; gap:14px;
}
.tile.hero::before{
  content:""; position:absolute; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,92,26,.35),transparent 70%);
  top:-90px; right:-60px; pointer-events:none;
}
.mark{
  width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:var(--accent); display:flex;align-items:center;justify-content:center;
  font-size:26px; box-shadow:0 6px 18px rgba(255,92,26,.45);
}
.hero h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px}
.hero .sub{font-size:12.5px;color:rgba(255,255,255,.65);margin-top:3px}
.hero .wake{
  margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.4px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16);
  padding:7px 12px; border-radius:999px; white-space:nowrap;
}

/* ---------- статус + часы ---------- */
.tile.stat{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:104px}
.dot-row{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);transition:.3s}
.dot.on{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.dot.busy{background:var(--accent);box-shadow:0 0 0 4px rgba(255,92,26,.18);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.stat .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.stat .val{font-size:15px;font-weight:800;letter-spacing:-.2px}
#clock{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
#clock small{font-size:11px;color:var(--muted);font-weight:700;margin-left:6px}

/* ---------- профиль ---------- */
.tile.profile{display:flex;align-items:center;gap:12px}
.ava{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#ffe3d1,#ffd6ba);
  display:flex;align-items:center;justify-content:center;font-size:21px;
}
.pname{font-weight:800;font-size:14.5px;margin:0}
.prole{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.badge{margin-left:auto;padding:6px 11px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap}
.badge.guest{background:rgba(239,68,68,.12);color:#dc2626}
.badge.staff{background:rgba(34,197,94,.14);color:#15803d}
#loginBox{display:flex;gap:8px;width:100%}
#loginBox input{
  flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  font:inherit;font-size:14px;font-weight:600;outline:none;background:var(--panel);color:var(--ink);transition:.2s;
}
#loginBox input:focus{border-color:var(--accent);background:#fff}
.btn-ink{
  background:var(--grafit);color:#fff;border:none;cursor:pointer;border-radius:var(--r-sm);
  font:inherit;font-weight:700;font-size:13.5px;padding:11px 15px;transition:.2s;white-space:nowrap;
}
.btn-ink:hover{transform:translateY(-1px)}
.btn-ink:active{transform:scale(.95)}

/* ---------- чат ---------- */
.tile.chat{padding:10px;height:min(56vh,460px);display:flex;flex-direction:column}
#chat{
  flex:1;overflow-y:auto;padding:8px 6px 4px;display:flex;flex-direction:column;gap:12px;
  scrollbar-width:none;
}
#chat::-webkit-scrollbar{display:none}
.msg{
  max-width:84%;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  overflow-wrap:anywhere;padding:11px 15px;animation:msgIn .3s cubic-bezier(.2,.9,.3,1.15);
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.bot{
  align-self:flex-start;background:var(--panel);border-radius:6px 18px 18px 18px;
  border:1px solid var(--border);
}
.msg.bot::before{
  content:"📦"; font-size:12px; display:block; margin-bottom:2px; opacity:.55;
}
.msg.user{
  align-self:flex-end;background:var(--grafit);color:#fff;border-radius:18px 6px 18px 18px;
}
.msg .time{display:block;font-size:9.5px;margin-top:5px;opacity:.45;font-weight:600}
.msg.typing{display:flex;gap:5px;align-items:center;padding:15px 18px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bnc 1.1s infinite}
.msg.typing i:nth-child(2){animation-delay:.14s}
.msg.typing i:nth-child(3){animation-delay:.28s}
@keyframes bnc{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}

/* ---------- чипы быстрых команд ---------- */
.chips{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:12px 4px 4px;
}
.chip{
  padding:9px 14px;border-radius:999px;border:1.5px solid var(--border);
  background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip:active{transform:scale(.94)}

/* ---------- нижняя панель ввода ---------- */
.dock{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  width:calc(100% - 28px);max-width:532px;z-index:50;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--border);border-radius:28px;
  padding:10px 12px;box-shadow:0 16px 44px rgba(28,31,38,.18);
}
.dock input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  font:inherit;font-size:15px;font-weight:600;color:var(--ink);padding:8px 4px;
}
.dock input::placeholder{color:var(--muted);font-weight:500}
.btn-orb{
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:19px;transition:.2s;
}
.orb-ghost{background:var(--panel);border:1.5px solid var(--border)!important;color:var(--ink)}
.orb-ghost:hover{border-color:var(--accent)!important;transform:scale(1.06)}
.orb-ghost.listening{background:var(--green);border-color:var(--green)!important;color:#fff;animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}50%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
.orb-go{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(255,92,26,.4)}
.orb-go:hover{transform:scale(1.06);background:var(--accent-dark)}
.orb-go:active{transform:scale(.9)}

/* ---------- строка статуса над доком ---------- */
#status-strip{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
  font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.9);
  border:1px solid var(--border);padding:6px 14px;border-radius:999px;
  box-shadow:var(--shadow);z-index:49;max-width:calc(100vw - 40px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;visibility:hidden;transition:.3s;
}
#status-strip.show{opacity:1;visibility:visible}
#status-strip .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:7px;vertical-align:middle}
#status-strip .eq span{width:3px;background:var(--accent);border-radius:2px;animation:eqj .9s infinite}
#status-strip .eq span:nth-child(1){height:5px}
#status-strip .eq span:nth-child(2){height:11px;animation-delay:.15s}
#status-strip .eq span:nth-child(3){height:8px;animation-delay:.3s}
@keyframes eqj{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* ---------- тосты ---------- */
#toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{
  background:var(--grafit);color:#fff;padding:12px 18px;border-radius:16px;
  box-shadow:0 14px 40px rgba(0,0,0,.3);font-size:13px;font-weight:600;
  opacity:0;visibility:hidden;transform:translateY(-14px);
  transition:.35s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:center;gap:9px;
}
.toast.show{opacity:1;visibility:visible;transform:none}
.toast.error{background:var(--red)}
</style>
</head>
<body>
<div class="bento">

  <div class="tile hero c6">
    <div class="mark">📦</div>
    <div>
      <h1>Склад</h1>
      <div class="sub">ЖД запчасти · голос и текст</div>
    </div>
    <div class="wake">«СКЛАД, …»</div>
  </div>

  <div class="tile stat c3">
    <div class="dot-row"><span class="dot" id="dot"></span><span class="lbl" id="dot-lbl">Система</span></div>
    <div class="val" id="dot-val">Готова слушать</div>
  </div>

  <div class="tile stat c3">
    <div><span class="lbl">Сейчас</span></div>
    <div id="clock">--:--<small></small></div>
  </div>

  <div class="tile profile c6">
    <div class="ava">👤</div>
    <div id="profileHeader" style="display:none;">
      <h3 class="pname" id="emp-name">Гость</h3>
      <div class="prole" id="emp-role">только остатки</div>
    </div>
    <div id="loginBox">
      <input id="email" placeholder="Почта (пусто — гость)" onkeydown="if(event.key=='Enter')doLogin()">
      <button class="btn-ink" onclick="doLogin()">Войти</button>
    </div>
    <span class="badge guest" id="access-badge" style="display:none;">Только остатки</span>
  </div>

  <div class="tile chat c6">
    <div id="chat"></div>
    <div class="chips">
      <button class="chip" onclick="quick('склад, остатки')">📋 Остатки</button>
      <button class="chip" onclick="quick('склад, приход')">📥 Приход</button>
      <button class="chip" onclick="quick('склад, списал')">📤 Расход</button>
      <button class="chip" onclick="quick('склад, резерв')">🔒 Резерв</button>
      <button class="chip" onclick="quick('склад, отгрузка')">🚚 Отгрузка</button>
      <button class="chip" onclick="quick('склад, помощь')">❓ Помощь</button>
    </div>
  </div>

</div>

<div id="status-strip"><span id="strip-html"></span><span id="strip-text"></span></div>

<div class="dock">
  <button class="btn-orb orb-ghost" id="mic" onclick="onMic()" title="Микрофон">🎤</button>
  <input id="text" placeholder="«Склад, сколько РТИ-132?»" onkeydown="if(event.key=='Enter')sendText()" autocomplete="off">
  <button class="btn-orb orb-go" onclick="sendText()" title="Отправить">→</button>
</div>

<div id="toast-container"><div id="toast" class="toast"></div></div>

<script>
// Запасной адрес на случай, если страница открыта не из веб-приложения.
// Основной путь — google.script.run: он не зависит от перевыкладывания скрипта.
const API_URL = 'https://script.google.com/macros/s/AKfycbx2TFgGSV5m5PepRm-q2JMWp3xi-5DjhrXTjZFKanadnVEJvHzQzpFFEZpGHmE0-L39/exec';

let user = { email: '', name: 'Гость', canWrite: false };
let voiceState = {};
let rec = null;
let listening = false;
let autoMode = true;
let botSpeaking = false;
let micGranted = false;
let restartTimer = null;
let toastTimer = null;
let statusTimer = null;

// ---------- ТОСТЫ ----------
function showToast(message, type) {
  const toast = document.getElementById('toast');
  toast.className = 'toast show' + (type === 'error' ? ' error' : '');
  toast.textContent = '';
  const icon = document.createElement('span');
  icon.textContent = type === 'error' ? '❌' : '✅';
  const body = document.createElement('span');
  body.textContent = message;
  toast.append(icon, body);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}

// ---------- ЧИСЛА СЛОВАМИ ----------
const NUM_WORDS = {
  'ноль':'0','один':'1','одна':'1','одно':'1','два':'2','две':'2','три':'3','четыре':'4','пять':'5',
  'шесть':'6','семь':'7','восемь':'8','девять':'9','десять':'10','одиннадцать':'11','двенадцать':'12',
  'тринадцать':'13','четырнадцать':'14','пятнадцать':'15','шестнадцать':'16','семнадцать':'17',
  'восемнадцать':'18','девятнадцать':'19','двадцать':'20','тридцать':'30','сорок':'40','пятьдесят':'50',
  'шестьдесят':'60','семьдесят':'70','восемьдесят':'80','девяносто':'90','сто':'100','двести':'200',
  'триста':'300','четыреста':'400','пятьсот':'500','шестьсот':'600','семьсот':'700','восемьсот':'800','девятьсот':'900'
};

function wordsToDigits(s) {
  const toks = String(s).split(/\s+/), out = [];
  let total = 0, cur = 0, inRun = false;
  const flush = () => {
    if (inRun) { out.push(String(total + cur)); total = 0; cur = 0; inRun = false; }
  };
  for (let i = 0; i < toks.length; i++) {
    const w = toks[i].replace(/[.,;:!?]+$/g, '');
    if (NUM_WORDS[w] !== undefined) {
      const v = parseInt(NUM_WORDS[w], 10);
      if (v >= 20) { if (inRun) total += cur; cur = v; inRun = true; }
      else { cur += v; inRun = true; }
    } else { flush(); out.push(toks[i]); }
  }
  flush();
  return out.join(' ');
}

// ---------- СИНОНИМЫ ----------
const SYNONYMS = [
  { re: /(добав(?:ить|ь|ите)\s+(?:нов[а-яё]*\s+)?товар|созда(?:ть|й)\s+товар|заведи\s+товар)/i, to: 'добавь товар' },
  { re: /(сним[а-яё]*\s+резерв[а-яё]*|убер[а-яё]*\s+резерв[а-яё]*|отмен[а-яё]*\s+резерв[а-яё]*)/i, to: 'сними резерв' },
  { re: /(зарезервир[а-яё]*|забронир[а-яё]*|бронь)/i, to: 'резерв' },
  { re: /отгруз[а-яё]*/i, to: 'отгрузка' },
  { re: /(прибав[а-яё]*|приход[а-яё]*|привез[а-яё]*|принесли|поступлени[а-яё]*|плюс)/i, to: 'пришло' },
  { re: /(расход[а-яё]*|продали|увез[а-яё]*|ушло|минус|убав[а-яё]*)/i, to: 'списал' },
  { re: /(остатк[а-яё]*|сколько\s+остал[а-яё]*)/i, to: 'сколько' }
];

function normalize(q) {
  let s = String(q).toLowerCase().replace(/ё/g, 'е');
  s = wordsToDigits(s);
  s = (' ' + s + ' ')
    .replace(/\s+(?:точка|точки|точку)\s+/g, '.')
    .replace(/\s+(?:тире|дефис|черточка)\s+/g, '-')
    .replace(/\s+запята[яию]\s+/g, ',')
    .replace(/\s+слэш\s+/g, '/')
    .replace(/\s{2,}/g, ' ')
    .trim();
  s = s.replace(/(^|[^а-яa-z\d_])([а-яa-z]{1,4})\s+(\d{2,6})(?![\dа-яa-z])/g, '$1$2$3');
  for (const { re, to } of SYNONYMS) { if (re.test(s)) { s = s.replace(re, ' ' + to + ' '); break; } }
  return s.replace(/\s{2,}/g, ' ').trim();
}

// ---------- СЕРВЕР ----------
async function api(params) {
  if (window.google && google.script.run) {
    if (params.action === 'login') {
      return new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiLogin(params.email || ''));
    }
    if (params.action === 'voice') {
      let st = params.state;
      if (typeof st === 'string') { try { st = JSON.parse(st || '{}'); } catch (e) { st = {}; } }
      return new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
          .apiVoice({ query: params.query || '', state: st || {}, email: params.email || '' }));
    }
    throw new Error('Неизвестное действие: ' + params.action);
  }
  const url = new URL(API_URL);
  for (const k in params) {
    const v = params[k];
    url.searchParams.set(k, typeof v === 'object' ? JSON.stringify(v) : v);
  }
  const res = await fetch(url.toString(), { method: 'GET' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ---------- ЧАТ ----------
function addMsg(text, who) {
  const box = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.appendChild(document.createTextNode(text));
  const tm = document.createElement('span');
  tm.className = 'time';
  const now = new Date();
  tm.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  d.appendChild(tm);
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function addTyping() {
  const box = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg bot typing';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('i');
    d.appendChild(dot);
  }
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}
function sendText() {
  const el = document.getElementById('text');
  const t = el.value.trim();
  if (!t) return;
  el.value = '';
  send(t);
}
function quick(cmd) { send(cmd); }
async function send(query) {
  addMsg(query, 'user');
  const norm = normalize(query);
  const t = addTyping();
  setDot('busy', 'Обрабатываю', 'Думаю над запросом…');
  try {
    const out = await api({ action: 'voice', query: norm, state: voiceState, email: user.email });
    voiceState = out.state || {};
    t.remove();
    addMsg(out.reply, 'bot');
    speak(out.reply);
    setDot('off', 'Система', 'Готова слушать');
  } catch (err) {
    t.remove();
    addMsg('Ошибка связи: ' + (err && err.message ? err.message : err), 'bot');
    setDot('off', 'Система', 'Готова слушать');
  }
}
async function doLogin() {
  const email = document.getElementById('email').value;
  const t = addTyping();
  try {
    const acc = await api({ action: 'login', email: email });
    t.remove();
    if (acc && acc.ok === false) {
      showToast(acc.message || 'Не получилось войти', 'error');
      return;
    }
    user = acc;
    document.getElementById('emp-name').textContent = acc.name || 'Гость';
    document.getElementById('emp-role').textContent = acc.canWrite ? (acc.role || 'полный доступ') : 'только остатки';
    const badge = document.getElementById('access-badge');
    badge.textContent = acc.canWrite ? '✓ Полный доступ' : 'Только остатки';
    badge.className = 'badge ' + (acc.canWrite ? 'staff' : 'guest');
    badge.style.display = 'inline-block';
    document.getElementById('profileHeader').style.display = 'block';
    document.getElementById('loginBox').style.display = 'none';
    addMsg(acc.message, 'bot');
    speak(acc.message);
    showToast(acc.canWrite ? 'Полный доступ' : 'Только остатки');
  } catch (err) {
    t.remove();
    showToast('Ошибка входа: ' + (err && err.message ? err.message : err), 'error');
  }
}

// ---------- СТАТУС И ЧАСЫ ----------
function setDot(mode, lbl, val) {
  const d = document.getElementById('dot');
  d.className = 'dot ' + (mode === 'on' ? 'on' : mode === 'busy' ? 'busy' : '');
  document.getElementById('dot-lbl').textContent = lbl;
  document.getElementById('dot-val').textContent = val;
}
function tickClock() {
  const n = new Date();
  const t = n.getHours().toString().padStart(2, '0') + ':' + n.getMinutes().toString().padStart(2, '0');
  const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  document.getElementById('clock').innerHTML =
    t.replace(/:/, '<span style="opacity:.35">:</span>') + '<small>' + days[n.getDay()] + '</small>';
}
setInterval(tickClock, 1000);
tickClock();

function setStatus(text, withEq) {
  const strip = document.getElementById('status-strip');
  document.getElementById('strip-text').textContent = text || '';
  document.getElementById('strip-html').innerHTML = withEq
    ? '<span class="eq"><span></span><span></span><span></span></span>' : '';
  clearTimeout(statusTimer);
  if (text) {
    strip.classList.add('show');
    statusTimer = setTimeout(() => strip.classList.remove('show'), 6000);
  } else strip.classList.remove('show');
}

// ---------- МИКРОФОН ----------
async function onMic() {
  if (listening) { try { rec.stop(); } catch (e) {} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('Нужен Chrome или Яндекс.Браузер', 'error'); return; }
  if (micGranted) { startRecognition(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(tr => tr.stop());
    micGranted = true;
    startRecognition();
  } catch (e) {
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      showToast('Микрофон запрещён: значок 🎤 слева от адреса → «Разрешить»', 'error');
    } else if (e.name === 'NotFoundError') {
      showToast('Микрофон не найден. Проверьте подключение', 'error');
    } else {
      showToast('Микрофон недоступен: ' + e.name, 'error');
    }
    if (autoMode) { autoMode = false; }
  }
}

function scheduleRestart() {
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    if (autoMode && !listening && !botSpeaking) startRecognition();
  }, 700);
}

function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new SR();
  rec.lang = 'ru-RU';
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  listening = true;
  setMic(true);
  setDot('busy', 'Микрофон', 'Слушаю… говорите');
  setStatus('Слушаю… говорите', true);

  rec.onresult = function (e) {
    let interim = '', final = '';
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) final += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (interim) setStatus('Слышу: «' + interim.trim() + '»', true);
    if (final.trim()) {
      setStatus('');
      listening = false; setMic(false);
      send(final.trim());
    }
  };

  rec.onerror = function (e) {
    listening = false; setMic(false);
    setDot('off', 'Система', 'Готова слушать');
    const map = {
      'not-allowed': 'Доступ к микрофону запрещён браузером',
      'network': 'Нет связи с сервером распознавания — проверьте интернет',
      'audio-capture': 'Микрофон не найден'
    };
    if (e.error !== 'aborted' && e.error !== 'no-speech') {
      showToast(map[e.error] || ('Ошибка: ' + e.error), 'error');
    }
  };

  rec.onend = function () {
    listening = false; setMic(false);
    if (botSpeaking) return;
    if (autoMode) { setStatus('Слушаю дальше… (авто-режим)', false); scheduleRestart(); }
    else setStatus('Ожидание. Нажмите 🎤, чтобы сказать ещё', false);
  };

  try { rec.start(); }
  catch (e) { listening = false; setMic(false); }
}

function setMic(on) {
  const b = document.getElementById('mic');
  b.classList.toggle('listening', on);
  b.textContent = on ? '⏹' : '🎤';
}

function toggleAutoMode() {
  autoMode = !autoMode;
  showToast(autoMode ? 'Авто-режим включён 🎙️' : 'Авто-режим выключен');
  if (autoMode) { onMic(); }
  else {
    clearTimeout(restartTimer);
    if (listening) { try { rec.stop(); } catch (e) {} }
    setStatus('Авто-режим выключен', false);
  }
}

// ============ ГОЛОС: SpeechKit + встроенный запасной TTS ============
// Основной путь: сервер запрашивает аудио у SpeechKit и отдаёт в base64.
// Если ключа нет или SpeechKit недоступен — включается браузерный голос.

let currentAudio = null;

function afterSpeak() {
  botSpeaking = false;
  if (autoMode && !listening) scheduleRestart();
}

// Запасной движок — встроенный браузерный голос
function speakFallback(text) {
  if (!window.speechSynthesis) { afterSpeak(); return; }
  try {
    speechSynthesis.cancel();
    let clean = String(text).replace(/\n+/g, '. ').trim();
    if (clean.length > 300) {
      const cut = clean.lastIndexOf(' ', 300);
      clean = clean.slice(0, cut > 0 ? cut : 300) + '…';
    }
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'ru-RU';
    u.rate = 1.02; u.pitch = 0.85;
    u.onend = afterSpeak; u.onerror = afterSpeak;
    speechSynthesis.speak(u);
  } catch (e) { afterSpeak(); }
}

// Для страницы, открытой вне Apps Script, — прямой запрос на API_URL
async function fetchTts(text) {
  const url = new URL(API_URL);
  url.searchParams.set('action', 'tts');
  url.searchParams.set('text', text);
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function speak(text) {
  try {
    if (listening) { botSpeaking = true; try { rec.stop(); } catch (e) {} }
    botSpeaking = true;

    let clean = String(text).trim().replace(/\n+/g, '. ');
    if (clean.length > 4500) clean = clean.slice(0, 4500);
    if (!clean) { afterSpeak(); return; }

    const cb = (typeof google !== 'undefined' && google.script && google.script.run)
      ? fn => google.script.run.withSuccessHandler(fn).withFailureHandler(() => speakFallback(clean)).apiTts(clean)
      : fn => fetchTts(clean).then(fn).catch(() => speakFallback(clean));

    cb(res => {
      if (!res || !res.ok) { speakFallback(clean); return; }
      try {
        // base64 → байты → аудио
        const raw = atob(res.audio);
        const arr = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: res.mime || 'audio/mpeg' }));
        if (currentAudio) { currentAudio.pause(); URL.revokeObjectURL(currentAudio.src); }
        const a = new Audio(url);
        currentAudio = a;
        a.onended = () => { URL.revokeObjectURL(url); afterSpeak(); };
        a.onerror = () => { URL.revokeObjectURL(url); afterSpeak(); };
        a.play().catch(() => speakFallback(clean));
      } catch (e) { speakFallback(clean); }
    });
  } catch (e) { afterSpeak(); }
}

  'Склад на связи. Начинайте со слова «склад»: например, «склад, остатки».',

  'Слушаю после слова «склад». Можно писать или говорить голосом.'
];

  addMsg(greet + WELCOME[Math.floor(Math.random() * WELCOME.length)], 'bot');
});
