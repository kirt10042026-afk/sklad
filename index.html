<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ТСК — Склад</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef2;
  --ink:#1e2126; --muted:#8a8f99; --border:#e4e6eb;
  --card:#ffffff; --panel:#f4f5f8;
  --accent:#d92b2b; --accent-dark:#a81f1f; --accent-soft:rgba(217,43,43,.10);
  --deep:#23262d; --deep-2:#3a3f48;
  --green:#22c55e;
  --shadow:0 12px 32px rgba(30,33,38,.10);
  --r:26px; --r-sm:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Manrope',sans-serif; background:var(--bg); color:var(--ink);
  margin:0; padding:16px 14px 130px; min-height:100vh;
  display:flex; justify-content:center; overflow-x:hidden; position:relative;
}
/* живой фон: медленно плывущие пятна */
body::before, body::after{
  content:""; position:fixed; border-radius:50%; z-index:0; pointer-events:none;
  filter:blur(70px); opacity:.55;
}
body::before{
  width:420px;height:420px; left:-140px; top:-120px;
  background:radial-gradient(circle,rgba(217,43,43,.28),transparent 70%);
  animation:drift1 26s ease-in-out infinite alternate;
}
body::after{
  width:380px;height:380px; right:-120px; bottom:-100px;
  background:radial-gradient(circle,rgba(35,38,45,.22),transparent 70%);
  animation:drift2 32s ease-in-out infinite alternate;
}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,50px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-70px,-40px) scale(.95)}}

.bento{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-content:start;position:relative;z-index:1}
@media(max-width:480px){.bento{grid-template-columns:repeat(2,1fr)}}

/* ---------- плитки ---------- */
.tile{
  background:var(--card); border-radius:var(--r); padding:18px;
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);
  border:1px solid var(--border);
  animation:rise .5s cubic-bezier(.2,.9,.3,1.15) backwards;
}
.tile:nth-child(1){animation-delay:0s}.tile:nth-child(2){animation-delay:.07s}
.tile:nth-child(3){animation-delay:.14s}.tile:nth-child(4){animation-delay:.21s}
.tile:nth-child(5){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.c6{grid-column:span 6}.c3{grid-column:span 3}
@media(max-width:480px){.c6,.c3{grid-column:span 2}}

/* ---------- шапка: тёмное стекло с градиентом ---------- */
.tile.hero{
  background:linear-gradient(135deg,#7e1b1b 0%,#3a1416 60%,#23262d 100%);
  border:none; color:#fff; position:relative; overflow:hidden;
  display:flex; align-items:center; gap:14px; padding:20px;
}
.tile.hero::before{
  content:""; position:absolute; width:300px; height:300px; border-radius:50%;
  background:radial-gradient(circle,rgba(217,43,43,.5),transparent 70%);
  top:-120px; right:-90px; pointer-events:none;
  animation:heroGlow 7s ease-in-out infinite alternate;
}
@keyframes heroGlow{from{opacity:.75;transform:scale(1)}to{opacity:1;transform:scale(1.18)}}
/* FIX: убран overflow:hidden (обрезал кольцо), добавлен isolation:isolate
   (иначе z-index:-1 уводил кольцо под фон плитки) и размер эмодзи-заглушки */
.logo{
  width:58px;height:58px;border-radius:50%;flex-shrink:0;
  background:#fff; display:flex;align-items:center;justify-content:center;
  position:relative; isolation:isolate; font-size:26px;
}
/* вращающееся световое кольцо вокруг логотипа */
.logo::after{
  content:""; position:absolute; inset:-4px; border-radius:50%; z-index:-1;
  background:conic-gradient(from 0deg,transparent 0 40%,rgba(255,120,120,.9) 50%,transparent 60% 100%);
  animation:spin 6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.hero h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px}
.hero .sub{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:3px}
.hero .badge-live{
  margin-left:auto; display:flex; align-items:center; gap:7px;
  font-size:11.5px; font-weight:800; letter-spacing:.4px;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
  padding:8px 14px; border-radius:999px; white-space:nowrap;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.badge-live .pulse{
  width:8px; height:8px; border-radius:50%; background:#4ade80;
  box-shadow:0 0 0 0 rgba(74,222,128,.6); animation:pulseDot 1.8s infinite;
  transition:background .3s;
}
@keyframes pulseDot{
  0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}
  70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
  100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
}

/* ---------- статус + часы ---------- */
.tile.stat{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:122px}
.dot-row{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);transition:.3s}
.dot.on{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.dot.busy{background:var(--accent);box-shadow:0 0 0 4px rgba(217,43,43,.18);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.stat .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.stat .val{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.auto-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:8px 10px;cursor:pointer;user-select:none;transition:.2s;
}
.auto-row:hover{border-color:var(--accent)}
.auto-row .t-name{font-size:12px;font-weight:700;color:var(--ink)}
.auto-row .t-hint{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px}
.switch{
  position:relative;width:40px;height:22px;flex-shrink:0;
  background:#d5d8de;border-radius:999px;transition:.25s;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;
  border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.25s;
}
.switch.on{background:var(--green)}
.switch.on::after{left:21px}
#clock{font-size:25px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
#clock small{font-size:11px;color:var(--muted);font-weight:700;margin-left:6px}

/* ---------- профиль ---------- */
.tile.profile{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ava{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:var(--accent-soft); border:2px solid #fff;
  box-shadow:0 4px 14px rgba(217,43,43,.18);
  display:flex;align-items:center;justify-content:center;font-size:21px;
}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.pname{font-weight:800;font-size:14.5px;margin:0}
.prole{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.badge{margin-left:auto;padding:6px 11px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap}
.badge.guest{background:rgba(217,43,43,.12);color:var(--accent-dark)}
.badge.staff{background:rgba(34,197,94,.14);color:#15803d}
.btn-mini{
  margin-left:auto;border:1.5px solid var(--border);background:var(--panel);color:var(--muted);
  font:inherit;font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer;transition:.2s;
}
.btn-mini:hover{border-color:var(--accent);color:var(--accent-dark)}
#loginBox{display:flex;gap:8px;width:100%}
#loginBox input{
  flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  font:inherit;font-size:14px;font-weight:600;outline:none;background:var(--panel);color:var(--ink);transition:.2s;
}
#loginBox input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.btn-ink{
  background:var(--deep);color:#fff;border:none;cursor:pointer;border-radius:var(--r-sm);
  font:inherit;font-weight:700;font-size:13.5px;padding:11px 15px;transition:.2s;white-space:nowrap;
}
.btn-ink:hover{transform:translateY(-1px);background:var(--deep-2)}
.btn-ink:active{transform:scale(.95)}

/* ---------- чат ---------- */
.tile.chat{padding:10px;height:min(60vh,520px);display:flex;flex-direction:column}
#chat{
  flex:1;overflow-y:auto;padding:10px 8px 6px;display:flex;flex-direction:column;gap:14px;
  scrollbar-width:none;
}
#chat::-webkit-scrollbar{display:none}
.msg{max-width:84%;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  overflow-wrap:anywhere;animation:msgIn .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* строки с аватаром: помощница слева */
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.user-row{justify-content:flex-end}
.msg-ava{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:#fff;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:15px;
  box-shadow:0 3px 10px rgba(30,33,38,.12);
}
.msg-ava img{width:100%;height:100%;object-fit:cover;display:block}
.msg{padding:11px 15px}
.msg.bot{background:var(--panel);border-radius:4px 18px 18px 18px;border:1px solid var(--border)}
.msg.user{
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border-radius:18px 4px 18px 18px;
  box-shadow:0 6px 18px rgba(217,43,43,.25);
}
.msg .time{display:block;font-size:9.5px;margin-top:5px;opacity:.45;font-weight:600}
.msg.typing{display:flex;gap:5px;align-items:center;padding:15px 18px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bnc 1.1s infinite}
.msg.typing i:nth-child(2){animation-delay:.14s}
.msg.typing i:nth-child(3){animation-delay:.28s}
@keyframes bnc{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}

/* ---------- нижняя панель: стекло со свечением ---------- */
.dock{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  width:calc(100% - 28px);max-width:532px;z-index:50;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--border);border-radius:28px;
  padding:10px 12px;box-shadow:0 16px 44px rgba(30,33,38,.18);
}
.dock::before{
  content:"";position:absolute;inset:-1px;border-radius:29px;z-index:-1;
  background:linear-gradient(120deg,rgba(217,43,43,.35),transparent 40%,transparent 60%,rgba(35,38,45,.25));
  opacity:.5;filter:blur(6px);
}
.dock input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  font:inherit;font-size:15px;font-weight:600;color:var(--ink);padding:8px 4px;
}
.dock input::placeholder{color:var(--muted);font-weight:500}
.btn-orb{
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:19px;transition:.2s;position:relative;
}
.orb-ghost{background:var(--panel);border:1.5px solid var(--border)!important;color:var(--ink)}
.orb-ghost:hover{border-color:var(--accent)!important;transform:scale(1.06)}
.orb-ghost.listening{background:var(--accent);border-color:var(--accent)!important;color:#fff}
/* волны вокруг микрофона, когда слушает */
.orb-ghost.listening::before,.orb-ghost.listening::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(217,43,43,.5);animation:micWave 1.5s ease-out infinite;
}
.orb-ghost.listening::after{animation-delay:.5s}
@keyframes micWave{from{transform:scale(1);opacity:.8}to{transform:scale(1.8);opacity:0}}
.orb-go{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 6px 18px rgba(217,43,43,.4)}
.orb-go:hover{transform:scale(1.06);filter:brightness(1.05)}
.orb-go:active{transform:scale(.9)}

/* ---------- строка статуса над доком ---------- */
#status-strip{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.92);
  border:1px solid var(--border);padding:6px 14px;border-radius:999px;
  box-shadow:var(--shadow);z-index:49;max-width:calc(100vw - 40px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;visibility:hidden;transition:.3s;
}
#status-strip.show{opacity:1;visibility:visible}
#status-strip .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:7px;vertical-align:middle}
#status-strip .eq span{width:3px;background:var(--accent);border-radius:2px;animation:eqj .9s infinite}
#status-strip .eq span:nth-child(1){height:5px}
#status-strip .eq span:nth-child(2){height:11px;animation-delay:.15s}
#status-strip .eq span:nth-child(3){height:8px;animation-delay:.3s}
@keyframes eqj{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* ---------- тосты ---------- */
#toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{
  background:var(--deep);color:#fff;padding:12px 18px;border-radius:16px;
  box-shadow:0 14px 40px rgba(0,0,0,.3);font-size:13px;font-weight:600;
  opacity:0;visibility:hidden;transform:translateY(-14px);
  transition:.35s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:center;gap:9px;
}
.toast.show{opacity:1;visibility:visible;transform:none}
.toast.error{background:var(--accent-dark)}
</style>
</head>
<body>
<div class="bento">

  <div class="tile hero c6">
    <div class="logo" id="heroLogo">📦</div>
    <div>
      <h1>ТСК · Склад</h1>
      <div class="sub">Скорость отгрузки · начинается с голоса</div>
    </div>
    <div class="badge-live"><span class="pulse" id="livePulse"></span>на связи</div>
  </div>

  <div class="tile stat c3">
    <div class="dot-row"><span class="dot" id="dot"></span><span class="lbl" id="dot-lbl">Система</span></div>
    <div class="val" id="dot-val">Готова слушать</div>
    <div class="auto-row" onclick="toggleAutoMode()">
      <div>
        <div class="t-name">Авто-режим</div>
        <div class="t-hint" id="autoHint">слушает сама</div>
      </div>
      <div class="switch on" id="autoSwitch"></div>
    </div>
  </div>

  <div class="tile stat c3">
    <div><span class="lbl">Сейчас</span></div>
    <div id="clock">--:--<small></small></div>
  </div>

  <div class="tile profile c6">
    <div class="ava" id="profileAva">👤</div>
    <div id="profileHeader" style="display:none;">
      <h3 class="pname" id="emp-name">Гость</h3>
      <div class="prole" id="emp-role">только остатки</div>
    </div>
    <div id="loginBox">
      <input id="email" placeholder="Почта (пусто — гость)" onkeydown="if(event.key=='Enter')doLogin()">
      <button class="btn-ink" onclick="doLogin()">Войти</button>
    </div>
    <span class="badge guest" id="access-badge" style="display:none;">Только остатки</span>
    <button class="btn-mini" id="btn-logout" style="display:none;" onclick="logout()">Сменить аккаунт</button>
  </div>

  <div class="tile chat c6"><div id="chat"></div></div>

</div>

<div id="status-strip"><span id="strip-html"></span><span id="strip-text"></span></div>

<div class="dock">
  <button class="btn-orb orb-ghost" id="mic" onclick="onMic()" title="Микрофон">🎤</button>
  <input id="text" placeholder="Скажите или напишите: «склад, сколько рти-394?»" onkeydown="if(event.key=='Enter')sendText()" autocomplete="off">
  <button class="btn-orb orb-go" onclick="sendText()" title="Отправить">→</button>
</div>

<div id="toast-container"><div id="toast" class="toast"></div></div>

<script>
// Запасной адрес на случай, если страница открыта не из веб-приложения.
const API_URL = 'https://script.google.com/macros/s/AKfycbxfhv4T3olgBLWKv8MKqRUxpxgeK0gMeJjfLZJnaapyPeF-kFoQkvBEO6i42yjo8xK3/exec';

// ---------- АВАТАРКА ----------
// Загрузите логотип на Google Диск («все, у кого есть ссылка»),
// скопируйте из ссылки идентификатор файла и вставьте сюда:
const AVATAR_URL = ''; // пример: 'https://drive.google.com/uc?export=view&id=1AbCdEfGh...'

(function applyAvatar() {
  if (!AVATAR_URL) return;
  [document.getElementById('heroLogo'), document.getElementById('profileAva')].forEach(box => {
    const img = new Image();
    img.src = AVATAR_URL;
    img.alt = 'ТСК';
    img.onerror = () => box.textContent = '📦';
    box.textContent = '';
    box.appendChild(img);
  });
})();

// ---------- ПАМЯТЬ О ПОЧТЕ ----------

const LS_EMAIL = 'tsk_sklad_email';

function saveEmail(e) {
  try { localStorage.setItem(LS_EMAIL, e); } catch (err) {}
  try { document.cookie = LS_EMAIL + '=' + encodeURIComponent(e) + ';max-age=31536000;path=/;SameSite=Lax'; } catch (err) {}
}
function loadEmail() {
  try { var v = localStorage.getItem(LS_EMAIL); if (v) return v; } catch (e) {}
  try {
    var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + LS_EMAIL + '=([^;]*)'));
    if (m) return decodeURIComponent(m[1]);
  } catch (e) {}
  return '';
}
function forgetEmail() {
  try { localStorage.removeItem(LS_EMAIL); } catch (e) {}
  try { document.cookie = LS_EMAIL + '=;max-age=0;path=/'; } catch (e) {}
}


let user = { email: '', name: 'Гость', canWrite: false };
let voiceState = {};
let rec = null;
let listening = false;
let autoMode = true;
let botSpeaking = false;
let micGranted = false;
let restartTimer = null;
let toastTimer = null;
let statusTimer = null;

// ---------- ТОСТЫ ----------
function showToast(message, type) {
  const toast = document.getElementById('toast');
  toast.className = 'toast show' + (type === 'error' ? ' error' : '');
  toast.textContent = '';
  const icon = document.createElement('span');
  icon.textContent = type === 'error' ? '❌' : '✅';
  const body = document.createElement('span');
  body.textContent = message;
  toast.append(icon, body);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}

function setLivePulse(color) {
  const p = document.getElementById('livePulse');
  if (p) p.style.background = color;
}

// ---------- ЧИСЛА СЛОВАМИ ----------
const NUM_WORDS = {
  'ноль':'0','один':'1','одна':'1','одно':'1','два':'2','две':'2','три':'3','четыре':'4','пять':'5',
  'шесть':'6','семь':'7','восемь':'8','девять':'9','десять':'10','одиннадцать':'11','двенадцать':'12',
  'тринадцать':'13','четырнадцать':'14','пятнадцать':'15','шестнадцать':'16','семнадцать':'17',
  'восемнадцать':'18','девятнадцать':'19','двадцать':'20','тридцать':'30','сорок':'40','пятьдесят':'50',
  'шестьдесят':'60','семьдесят':'70','восемьдесят':'80','девяносто':'90','сто':'100','двести':'200',
  'триста':'300','четыреста':'400','пятьсот':'500','шестьсот':'600','семьсот':'700','восемьсот':'800','девятьсот':'900'
};

function wordsToDigits(s) {
  const toks = String(s).split(/\s+/), out = [];
  let total = 0, cur = 0, inRun = false;
  const flush = () => {
    if (inRun) { out.push(String(total + cur)); total = 0; cur = 0; inRun = false; }
  };
  for (let i = 0; i < toks.length; i++) {
    const w = toks[i].replace(/[.,;:!?]+$/g, '');
    if (w === 'ноль') { flush(); out.push('0'); continue; }
    if (NUM_WORDS[w] !== undefined) {
      const v = parseInt(NUM_WORDS[w], 10);
      if (v >= 20) { if (inRun) total += cur; cur = v; inRun = true; }
      else { cur += v; inRun = true; }
    } else { flush(); out.push(toks[i]); }
  }
  flush();
  return out.join(' ');
}

// ---------- СИНОНИМЫ ----------
const SYNONYMS = [
  { re: /(добав(?:ить|ь|ите)\s+(?:нов[а-яё]*\s+)?товар|созда(?:ть|й)\s+товар|заведи\s+товар)/i, to: 'добавь товар' },
  { re: /(сним[а-яё]*\s+резерв[а-яё]*|убер[а-яё]*\s+резерв[а-яё]*|отмен[а-яё]*\s+резерв[а-яё]*)/i, to: 'сними резерв' },
  { re: /(зарезервир[а-яё]*|забронир[а-яё]*|бронь)/i, to: 'резерв' },
  { re: /отгруз[а-яё]*/i, to: 'отгрузка' },
  { re: /(прибав[а-яё]*|приход[а-яё]*|привез[а-яё]*|принесли|поступлени[а-яё]*)/i, to: 'пришло' },
  { re: /(расход[а-яё]*|продали|увез[а-яё]*|ушло|минус|убав[а-яё]*)/i, to: 'списал' },
  { re: /(остатк[а-яё]*|сколько\s+остал[а-яё]*)/i, to: 'сколько' }
];

function normalize(q) {
  let s = String(q).toLowerCase().replace(/ё/g, 'е');
  s = wordsToDigits(s);
  s = (' ' + s + ' ')
    .replace(/\s+(?:точка|точки|точку)\s+/g, '.')
    .replace(/\s+(?:тире|дефис|черточка)\s+/g, '-')
    .replace(/\s+запята[яию]\s+/g, ',')
    .replace(/\s+слэш\s+/g, '/')
    .replace(/\s{2,}/g, ' ')
    .trim();
  s = s.replace(/(^|[^а-яa-z\d_])([а-яa-z]{1,4})\s+(\d{2,6})(?![\dа-яa-z])/g,
    (m, p1, p2, p3) => /^(плюс|минус|умнож|раздели|подели|на|х)$/.test(p2) ? m : p1 + p2 + p3);
    // Математика: синонимы склада не подставляем, иначе «минус» станет «списал»
    // FIX: добавлен разбор арифметики словами между числами («5 минус 3» и т. п.)
  const isMath = /(?:сколько\s+(?:будет|выйдет|получится|равно)|чему\s+равно|посчита[а-яё]*|вычисл[а-яё]*|реши\b|дважды|трижды|корень|процент|умнож|раздели|подели)/.test(s)
    || /\d\s*[+\-*/×]\s*\d/.test(s)
    || /\d\s+(?:минус|плюс|умнож(?:ить)?|раздел(?:ить)?|на)\s+\d/.test(s);
  if (!isMath) {
    for (const { re, to } of SYNONYMS) { if (re.test(s)) { s = s.replace(re, ' ' + to + ' '); break; } }
  }
  return s.replace(/\s{2,}/g, ' ').trim();
}

// ---------- СЕРВЕР ----------
async function api(params) {
  if (window.google && google.script.run) {
    if (params.action === 'login') {
      return new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiLogin(params.email || ''));
    }
    if (params.action === 'voice') {
      let st = params.state;
      if (typeof st === 'string') { try { st = JSON.parse(st || '{}'); } catch (e) { st = {}; } }
      return new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
          .apiVoice({ query: params.query || '', state: st || {}, email: params.email || '' }));
    }
    throw new Error('Неизвестное действие: ' + params.action);
  }
  const url = new URL(API_URL);
  for (const k in params) {
    const v = params[k];
    url.searchParams.set(k, typeof v === 'object' ? JSON.stringify(v) : v);
  }
  const res = await fetch(url.toString(), { method: 'GET' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ---------- ЧАТ ----------
// Каждое сообщение — в строке с аватаром: помощница с логотипом слева,
// собеседник справа без аватара, как в живом чате.
function addMsg(text, who) {
  const box = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'msg-row' + (who === 'user' ? ' user-row' : '');
  if (who === 'bot') {
    const av = document.createElement('div');
    av.className = 'msg-ava';
    if (AVATAR_URL) {
      const img = new Image(); img.src = AVATAR_URL; img.alt = 'ТСК';
      img.onerror = () => av.textContent = '📦';
      av.appendChild(img);
    } else av.textContent = '📦';
    row.appendChild(av);
  }
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.appendChild(document.createTextNode(text));
  const tm = document.createElement('span');
  tm.className = 'time';
  const now = new Date();
  tm.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  d.appendChild(tm);
  row.appendChild(d);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}
function addTyping() {
  const box = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'msg-row';
  const av = document.createElement('div');
  av.className = 'msg-ava';
  if (AVATAR_URL) {
    const img = new Image(); img.src = AVATAR_URL; img.alt = '';
    av.appendChild(img);
  } else av.textContent = '📦';
  row.appendChild(av);
  const d = document.createElement('div');
  d.className = 'msg bot typing';
  for (let i = 0; i < 3; i++) d.appendChild(document.createElement('i'));
  row.appendChild(d);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
  return row;
}
function sendText() {
  const el = document.getElementById('text');
  const t = el.value.trim();
  if (!t) return;
  el.value = '';
  send(t);
}
async function send(query) {
  addMsg(query, 'user');
  const norm = normalize(query);
  const t = addTyping();
  setDot('busy', 'Обрабатываю', 'Думаю над запросом…');
  setLivePulse('#f87171');
  try {
    const out = await api({ action: 'voice', query: norm, state: voiceState, email: user.email });
    voiceState = out.state || {};
    t.remove();
    addMsg(out.reply, 'bot');
    speak(out.reply);
    setDot('off', 'Система', 'Готова слушать');
    setLivePulse('#4ade80');
  } catch (err) {
    t.remove();
    addMsg('Ошибка связи: ' + (err && err.message ? err.message : err), 'bot');
    setDot('off', 'Система', 'Готова слушать');
    setLivePulse('#4ade80');
  }
}

function showProfile(acc) {
  document.getElementById('emp-name').textContent = acc.name || 'Гость';
  document.getElementById('emp-role').textContent = acc.canWrite ? (acc.role || 'полный доступ') : 'только остатки';
  const badge = document.getElementById('access-badge');
  badge.textContent = acc.canWrite ? '✓ Полный доступ' : 'Только остатки';
  badge.className = 'badge ' + (acc.canWrite ? 'staff' : 'guest');
  badge.style.display = 'inline-block';
  document.getElementById('profileHeader').style.display = 'block';
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('btn-logout').style.display = 'inline-block';
}

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const t = addTyping();
  try {
    const acc = await api({ action: 'login', email: email });
    t.remove();
    if (acc && acc.ok === false) {
      showToast(acc.message || 'Не получилось войти', 'error');
      return;
    }
    user = acc;
    if (acc.found) saveEmail(user.email);
    else forgetEmail();
    showProfile(acc);
    addMsg(acc.message, 'bot');
    speak(acc.message);
    showToast(acc.canWrite ? 'Полный доступ' : 'Только остатки');
  } catch (err) {
    t.remove();
    showToast('Ошибка входа: ' + (err && err.message ? err.message : err), 'error');
  }
}

async function autoLogin() {
  const saved = loadEmail();
  if (!saved) return false;
  const t = addTyping();
  try {
    const acc = await api({ action: 'login', email: saved });
    t.remove();
    if (acc && acc.ok === false) { forgetEmail(); return false; }
    user = acc;
    if (acc.found) {
      showProfile(acc);
      addMsg(acc.message, 'bot');
      speak(acc.message);
      return true;
    }
    forgetEmail();
    return false;
  } catch (err) {
    t.remove();
    return false;
  }
}

function logout() {
  forgetEmail();
  user = { email: '', name: 'Гость', canWrite: false };
  document.getElementById('profileHeader').style.display = 'none';
  document.getElementById('btn-logout').style.display = 'none';
  const badge = document.getElementById('access-badge');
  badge.style.display = 'none';
  document.getElementById('loginBox').style.display = 'flex';
  document.getElementById('email').value = '';
  addMsg('Всё, вышла. Если вернётесь — напишите почту, и снова свои.', 'bot');
}

// ---------- СТАТУС И ЧАСЫ ----------
function setDot(mode, lbl, val) {
  const d = document.getElementById('dot');
  d.className = 'dot ' + (mode === 'on' ? 'on' : mode === 'busy' ? 'busy' : '');
  document.getElementById('dot-lbl').textContent = lbl;
  document.getElementById('dot-val').textContent = val;
}
function tickClock() {
  const n = new Date();
  const t = n.getHours().toString().padStart(2, '0') + ':' + n.getMinutes().toString().padStart(2, '0');
  const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  document.getElementById('clock').innerHTML =
    t.replace(/:/, '<span style="opacity:.35">:</span>') + '<small>' + days[n.getDay()] + '</small>';
}
setInterval(tickClock, 1000);
tickClock();

function setStatus(text, withEq) {
  const strip = document.getElementById('status-strip');
  document.getElementById('strip-text').textContent = text || '';
  document.getElementById('strip-html').innerHTML = withEq
    ? '<span class="eq"><span></span><span></span><span></span></span>' : '';
  clearTimeout(statusTimer);
  if (text) {
    strip.classList.add('show');
    statusTimer = setTimeout(() => strip.classList.remove('show'), 6000);
  } else strip.classList.remove('show');
}

// ---------- ТУМБЛЕР АВТО-РЕЖИМА ----------
function renderAuto() {
  document.getElementById('autoSwitch').classList.toggle('on', autoMode);
  document.getElementById('autoHint').textContent = autoMode ? 'слушает сама' : 'только по кнопке 🎤';
}

function toggleAutoMode() {
  autoMode = !autoMode;
  renderAuto();
  showToast(autoMode ? 'Авто-режим включён 🎙️' : 'Авто-режим выключен — говорите по кнопке 🎤');
  if (autoMode) { onMic(); }
  else {
    clearTimeout(restartTimer);
    if (listening) { try { rec.stop(); } catch (e) {} }
    setStatus('Авто-режим выключен', false);
    setDot('off', 'Система', 'Готова слушать');
  }
}

// ---------- МИКРОФОН ----------
async function onMic() {
  if (listening) { try { rec.stop(); } catch (e) {} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('Нужен Chrome или Яндекс.Браузер', 'error'); return; }
  if (micGranted) { startRecognition(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(tr => tr.stop());
    micGranted = true;
    startRecognition();
  } catch (e) {
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      showToast('Микрофон запрещён: значок 🎤 слева от адреса → «Разрешить»', 'error');
    } else if (e.name === 'NotFoundError') {
      showToast('Микрофон не найден. Проверьте подключение', 'error');
    } else {
      showToast('Микрофон недоступен: ' + e.name, 'error');
    }
    if (autoMode) { autoMode = false; renderAuto(); }
  }
}

function scheduleRestart() {
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    if (autoMode && !listening && !botSpeaking) startRecognition();
  }, 700);
}

function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new SR();
  rec.lang = 'ru-RU';
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  listening = true;
  setMic(true);
  setDot('busy', 'Микрофон', 'Слушаю… говорите');
  setStatus('Слушаю… говорите', true);

  rec.onresult = function (e) {
    let interim = '', final = '';
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) final += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (interim) setStatus('Слышу: «' + interim.trim() + '»', true);
    if (final.trim()) {
      setStatus('');
      listening = false; setMic(false);
      send(final.trim());
    }
  };

  rec.onerror = function (e) {
    listening = false; setMic(false);
    setDot('off', 'Система', 'Готова слушать');
    const map = {
      'not-allowed': 'Доступ к микрофону запрещён браузером',
      'network': 'Нет связи с сервером распознавания — проверьте интернет',
      'audio-capture': 'Микрофон не найден'
    };
    if (e.error === 'not-allowed') {
      // FIX: при запрете микрофона не перезапускаемся вечно, а гасим авто-режим
      showToast(map[e.error], 'error');
      if (autoMode) { autoMode = false; renderAuto(); }
      setStatus('Доступ к микрофону запрещён', false);
      return;
    }
    if (e.error !== 'aborted' && e.error !== 'no-speech') {
      showToast(map[e.error] || ('Ошибка: ' + e.error), 'error');
    }
    // FIX: после устранимого сбоя (сеть и т. п.) авто-режим пробует снова
    if (autoMode) scheduleRestart();
  };

  rec.onend = function () {
    listening = false; setMic(false);
    if (botSpeaking) return;
    if (autoMode) { setStatus('Слушаю дальше…', false); scheduleRestart(); }
    else setStatus('Ожидание. Нажмите 🎤, чтобы сказать ещё', false);
  };

  try { rec.start(); }
  catch (e) {
    listening = false; setMic(false);
    // FIX: сбрасываем статус «Слушаю…», если запустить не удалось
    setDot('off', 'Система', 'Готова слушать');
    setStatus('', false);
  }
}

function setMic(on) {
  const b = document.getElementById('mic');
  b.classList.toggle('listening', on);
  b.textContent = on ? '⏹' : '🎤';
}

// ============ ГОЛОС: SpeechKit + женский запасной TTS ============
let currentAudio = null;
let voiceF = null;

function afterSpeak() {
  botSpeaking = false;
  if (autoMode && !listening) scheduleRestart();
}

function pickVoice() {
  if (!window.speechSynthesis) return;
  const ru = speechSynthesis.getVoices().filter(v => /ru/i.test(v.lang));
  if (!ru.length) return;
  voiceF =
    ru.find(v => /natural|neural|premium|enhanced/i.test(v.name)) ||
    ru.find(v => /alena|milena|tatyana|svetlana|female|женск/i.test(v.name)) ||
    ru.find(v => /google/i.test(v.name)) ||
    ru[0];
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
  setTimeout(pickVoice, 300);
  setTimeout(pickVoice, 1200);
}

function speakFallback(text) {
  if (!window.speechSynthesis) { afterSpeak(); return; }
  try {
    speechSynthesis.cancel();
    let clean = String(text).replace(/\n+/g, '. ').trim();
    if (clean.length > 300) {
      const cut = clean.lastIndexOf(' ', 300);
      clean = clean.slice(0, cut > 0 ? cut : 300) + '…';
    }
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'ru-RU';
    if (voiceF) u.voice = voiceF;
    u.rate = 1.05; u.pitch = 1.05;
    u.onend = afterSpeak; u.onerror = afterSpeak;
    speechSynthesis.speak(u);
  } catch (e) { afterSpeak(); }
}

async function fetchTts(text) {
  const url = new URL(API_URL);
  url.searchParams.set('action', 'tts');
  url.searchParams.set('text', text);
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function speak(text) {
  try {
    if (listening) { try { rec.stop(); } catch (e) {} }
    botSpeaking = true; // FIX: раньше строка дублировалась

    let clean = String(text).trim().replace(/\n+/g, '. ');
    if (clean.length > 4500) clean = clean.slice(0, 4500);
    if (!clean) { afterSpeak(); return; }

    const cb = (typeof google !== 'undefined' && google.script && google.script.run)
      ? fn => google.script.run.withSuccessHandler(fn).withFailureHandler(() => speakFallback(clean)).apiTts(clean)
      : fn => fetchTts(clean).then(fn).catch(() => speakFallback(clean));

    cb(res => {
      if (!res || !res.ok) {
        console.warn('SpeechKit недоступен: ' + (res && res.message || '?'));
        speakFallback(clean);
        return;
      }
      try {
        const raw = atob(res.audio);
        const arr = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: res.mime || 'audio/mpeg' }));
        if (currentAudio) { currentAudio.pause(); URL.revokeObjectURL(currentAudio.src); }
        const a = new Audio(url);
        currentAudio = a;
        a.onended = () => { URL.revokeObjectURL(url); afterSpeak(); };
        a.onerror = () => { URL.revokeObjectURL(url); afterSpeak(); };
        a.play().catch(() => speakFallback(clean));
      } catch (e) { speakFallback(clean); }
    });
  } catch (e) { afterSpeak(); }
}

// ---------- ПРИВЕТСТВИЕ: как будто здоровается живой человек ----------
const WELCOME = [
  'Я тут, слушаю. Скажите «склад» и что нужно — например, «склад, остатки».',
  'Чем займёмся: остатки, приход, отгрузка? Или просто спросите что-нибудь.',
  'Склад на связи. Говорите — я слушаю и всё записываю.',
  'Скажите код или «склад, остатки» — покажу, что есть.'
];
document.addEventListener('DOMContentLoaded', () => {
  renderAuto();
  const h = new Date().getHours();
  let greet = h < 6 ? 'Доброй ночи. ' : h < 12 ? 'Доброе утро. ' : h < 18 ? 'Добрый день. ' : 'Добрый вечер. ';
  autoLogin().then(loggedIn => {
    if (!loggedIn) addMsg(greet + WELCOME[Math.floor(Math.random() * WELCOME.length)], 'bot');
  });
});
